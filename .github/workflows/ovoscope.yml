name: OVOScope end-to-end tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    with:
      python_version: "3.11"
      install_extras: test,end2end
      pytest_workers: "2"
      require_m2v: true
      require_padatious: true
      test_path: test/end2end/
      uv_prerelease: allow
      bus_coverage: true
      bus_coverage_include: ^skill-sonos-controller\.smartgic$
