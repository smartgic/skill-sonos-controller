[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-sonos-controller"
dynamic = ["version"]
description = "OpenVoiceOS skill for controlling Sonos speakers and music services"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gaëtan Trellu", email = "gaetan.trellu@smartgic.io" }
]
keywords = ["openvoiceos", "ovos", "skill", "sonos", "soco"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "ovos-bus-client>=1.3.8a1,<3.0.0",
  "ovos-number-parser>=0.0.1,<1.0.0",
  "ovos-utils>=0.7.0,<1.0.0",
  "ovos-workshop>=8.0.0,<10.0.0",
  "padacioso>=1.0.0,<3.0.0",
  "requests>=2.31.0,<3.0.0",
  "soco>=0.31.2,<0.32.0",
]

[project.optional-dependencies]
test = [
  "build>=1.2.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12",
]
end2end = [
  "ovos-bus-client>=2.7.3a1,<3.0.0",
  "ovos-m2v-pipeline>=0.5.4a2,<1.0.0",
  "ovos-padatious>=2.0.1a2,<3.0.0",
  "ovos-utils>=0.13.9a2,<1.0.0",
  "ovos-workshop>=9.3.3a1,<10.0.0",
  "ovoscope>=1.5.0,<2.0.0",
  "padacioso>=2.2.2a2,<3.0.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/smartgic/skill-sonos-controller"
Issues = "https://github.com/smartgic/skill-sonos-controller/issues"
Source = "https://github.com/smartgic/skill-sonos-controller"

[project.entry-points."opm.skill"]
"skill-sonos-controller.smartgic" = "skill_sonos_controller:SonosControllerSkill"

[tool.setuptools.dynamic]
version = { attr = "skill_sonos_controller.version.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skill_sonos_controller*"]

[tool.setuptools.package-data]
skill_sonos_controller = [
  "locale/**/*",
  "settingsmeta.json",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=skill_sonos_controller.controller --cov=skill_sonos_controller.auth --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "live_sonos: opt-in test that briefly controls a real idle Sonos speaker",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
# Translation entries intentionally remain one per line for side-by-side review.
exclude = ["scripts/generate_locales.py"]
